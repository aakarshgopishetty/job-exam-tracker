<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1220">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Last Date">
<title>Last Date</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E1220; --surface:#151A2C; --raised:#1D2440; --line:#2A3252;
  --text:#EDF0FB; --muted:#8C94B3;
  --calm:#9DB0FF; --soon:#FFC14D; --urgent:#FF7A66; --done:#5E6584; --ok:#6FD3A0;
  --display:'Big Shoulders Display','Arial Narrow','Roboto Condensed',system-ui,sans-serif;
  --body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{min-height:100dvh;background:var(--bg);color:var(--text);font:400 16px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--calm);outline-offset:2px}

.wrap{max-width:560px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 20px 130px}
.top{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.brand{font:800 24px/1 var(--display);letter-spacing:.02em}
.tools{display:flex;gap:2px;margin-right:-10px}
.icon{all:unset;box-sizing:border-box;position:relative;width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--muted);cursor:pointer}
.icon:hover{color:var(--text)}
.icon:focus-visible{outline:2px solid var(--calm);outline-offset:-2px}
.dot{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--urgent);box-shadow:0 0 0 2px var(--bg)}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.hero{font:800 clamp(44px,13vw,64px)/.9 var(--display);letter-spacing:.005em;margin:26px 0 10px;text-wrap:balance}
.sub{color:var(--muted);max-width:44ch}

.banner{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:20px;font-size:14.5px}
.banner>span:first-child{flex:1 1 200px}
.bn{display:flex;gap:6px}

.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin-top:26px}
.tab{all:unset;box-sizing:border-box;cursor:pointer;padding:10px 0;color:var(--muted);font-weight:500;position:relative}
.tab:focus-visible{outline:2px solid var(--calm);outline-offset:2px;border-radius:6px}
.tab[aria-selected=true]{color:var(--text)}
.tab[aria-selected=true]::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--calm)}
.tab small{margin-left:6px;font-size:13px;color:var(--muted)}

.list{list-style:none;padding:0}
.job{border-bottom:1px solid var(--line)}
.row{all:unset;box-sizing:border-box;display:grid;grid-template-columns:88px 1fr 24px;gap:14px;align-items:center;width:100%;padding:18px 0;cursor:pointer}
.row:focus-visible{outline:2px solid var(--calm);outline-offset:2px;border-radius:8px}
.count{display:flex;flex-direction:column;align-items:flex-start;color:var(--c)}
.num{font:800 58px/.85 var(--display);letter-spacing:-.01em}
.num.word{font-size:32px;line-height:1}
.unit{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.2}
.info{display:grid;gap:2px;min-width:0}
.co{font-weight:600;font-size:17px;overflow-wrap:anywhere}
.role{font-size:15px;opacity:.85;overflow-wrap:anywhere}
.when{font-size:13px;color:var(--muted);margin-top:4px}
.chev{color:var(--muted);transition:transform .2s}
.row[aria-expanded=true] .chev{transform:rotate(180deg)}
.job.closed .co,.job.closed .role{color:var(--muted)}

.detail{padding:0 0 22px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px 20px;margin-bottom:14px}
.facts dt{font-size:12.5px;color:var(--muted)}
.facts dd{margin:0;font-size:15px;overflow-wrap:anywhere}
.note{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55;max-width:62ch;margin-bottom:14px}
.fine{font-size:13px;color:var(--muted);line-height:1.5}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.actions.stack{flex-direction:column}
.actions.stack .btn{width:100%}

.btn{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;background:var(--raised);border:1px solid var(--line);color:var(--text);font:600 15px/1 var(--body);cursor:pointer;text-align:center}
.btn:focus-visible{outline:2px solid var(--calm);outline-offset:2px}
.btn.primary{background:var(--calm);border-color:var(--calm);color:#0E1220}
.btn.danger{color:var(--urgent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn.wide{width:100%;margin-top:18px}
.link{all:unset;box-sizing:border-box;display:inline-block;cursor:pointer;color:var(--calm);font-weight:500;padding:12px 0;margin-top:14px}
.link:focus-visible{outline:2px solid var(--calm);outline-offset:2px;border-radius:6px}
.empty{color:var(--muted);padding:26px 0;max-width:40ch}

.fab{all:unset;box-sizing:border-box;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));display:inline-flex;align-items:center;gap:8px;height:52px;padding:0 24px;border-radius:26px;background:var(--calm);color:#0E1220;font:600 16px/1 var(--body);cursor:pointer;box-shadow:0 10px 28px rgba(0,0,0,.5);z-index:5}
.fab:focus-visible{outline:2px solid var(--text);outline-offset:3px}

.onboard{padding-top:max(12vh,env(safe-area-inset-top))}
.brand.big{font-size:clamp(76px,26vw,124px);line-height:.85;letter-spacing:0}
.lead{color:var(--muted);font-size:18px;line-height:1.5;max-width:30ch;margin:18px 0 30px}
.onboard .fine{margin-top:18px}

dialog{border:0;padding:0;background:var(--surface);color:var(--text);width:min(560px,100%);max-width:100%;margin:auto auto 0;border-radius:22px 22px 0 0;max-height:92dvh;overflow:auto}
dialog::backdrop{background:rgba(5,7,14,.7)}
@media (min-width:600px){dialog{margin:auto;border-radius:22px}}
.sheet{display:block;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px))}
.sheet h2{font:800 32px/1 var(--display);letter-spacing:.005em;margin-bottom:4px}

.field{display:grid;gap:6px;margin-top:16px}
.field>span{font-size:13px;color:var(--muted)}
.field>small{font-size:12.5px;color:var(--muted)}
input:not([type=checkbox]),textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:16px;color:var(--text);color-scheme:dark}
input:not([type=checkbox]):focus,textarea:focus{outline:2px solid var(--calm);outline-offset:0;border-color:var(--calm)}
textarea{resize:vertical;min-height:84px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.check{display:flex;gap:12px;align-items:flex-start;margin-top:18px;cursor:pointer;font-size:15px}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--calm);flex:none}
.check small{color:var(--muted);font-size:13px;line-height:1.4}
.rowline{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-top:1px solid var(--line);margin-top:16px}
.rowline small{color:var(--muted);font-size:13px}
.sheet>.fine{margin-top:14px}

.preview{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:14px;line-height:1.5;max-height:230px;overflow:auto;margin-top:14px}

.inbox{list-style:none;padding:0;margin-top:14px}
.inbox li{border-top:1px solid var(--line)}
.inbox button{all:unset;box-sizing:border-box;display:grid;gap:2px;width:100%;padding:14px 0;cursor:pointer}
.inbox button:focus-visible{outline:2px solid var(--calm);outline-offset:2px;border-radius:6px}
.inbox .t{font-weight:600}
.inbox .b{color:var(--text);opacity:.85;font-size:14.5px}
.inbox .ago{color:var(--muted);font-size:12.5px;margin-top:2px}

#toast{position:fixed;top:auto;right:auto;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));margin:0;transform:translateX(-50%);width:max-content;max-width:min(90vw,440px);padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--raised);color:var(--text);font-size:14.5px;line-height:1.4;text-align:center;overflow:visible;display:none;pointer-events:none}
#toast.show{display:block}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="sheet" aria-label="Details"></dialog>
<div id="toast" popover="manual" role="status" aria-live="polite"></div>
<noscript><p style="padding:24px">Last Date needs JavaScript to run.</p></noscript>

<script src="core.js"></script>
<script>
(() => {
'use strict';

/* =====================================================================
   GITHUB SETUP — fill this in with your own repo details.
   The job list lives in a file called jobs.json inside this same repo.
   1) In your repo, create a new file named jobs.json at the root, with
      just: []   (an empty array) — then commit it.
   2) GitHub -> Settings -> Developer settings -> Personal access tokens
      -> Fine-grained tokens -> Generate new token. Under "Repository
      access" pick only this one repo. Under "Permissions" set
      "Contents" to "Read and write". Copy the token (starts with
      "github_pat_") and paste it below.
   Note: this token lives in the page's code, so anyone who opens this
   site can see it in the browser dev tools. Scoping it to just this
   repo's contents (as above) limits the worst case to someone editing
   files in this repo — nothing else on your GitHub account.
   ===================================================================== */
const GITHUB = {
  owner: 'PASTE_YOUR_GITHUB_USERNAME',
  repo: 'PASTE_YOUR_REPO_NAME',
  branch: 'main',                 // change if your repo's default branch is different (e.g. "master")
  path: 'jobs.json',
  token: 'PASTE_YOUR_FINE_GRAINED_TOKEN'
};
const ghConfigured = () => !GITHUB.owner.startsWith('PASTE_') && !GITHUB.repo.startsWith('PASTE_') && !GITHUB.token.startsWith('PASTE_');
const rawUrl = () => `https://raw.githubusercontent.com/${GITHUB.owner}/${GITHUB.repo}/${GITHUB.branch}/${GITHUB.path}?t=${Date.now()}`;
const apiUrl = () => `https://api.github.com/repos/${GITHUB.owner}/${GITHUB.repo}/contents/${GITHUB.path}`;
const authHeaders = () => ({ 'Authorization': 'Bearer ' + GITHUB.token, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' });
const toB64 = str => btoa(String.fromCharCode(...new TextEncoder().encode(str)));
const fromB64 = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64), c => c.charCodeAt(0)));
const newId = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);

/* ---------- small helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safeUrl = u => { try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : ''; } catch (e) { return ''; } };
const ICON = {
  bell: '<path d="M6 9a6 6 0 1 1 12 0c0 5 2 6 2 7H4c0-1 2-2 2-7Z"/><path d="M10 19a2 2 0 0 0 4 0"/>',
  tune: '<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  down: '<path d="m6 9 6 6 6-6"/>',
  send: '<path d="M12 15V3M8 7l4-4 4 4M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/>'
};
const ic = (n, cls = '') => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;
const ago = t => {
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + ' min ago';
  const h = Math.round(m / 60);
  if (h < 24) return h + ' h ago';
  const d = Math.round(h / 24);
  return d + (d === 1 ? ' day ago' : ' days ago');
};

/* ---------- state ----------
   S.me: your name (local, per device). S.jobs: the shared job list (from jobs.json in the
   repo — same for everyone). appliedMap: which jobs YOU marked applied (local, not shared). */
let S = { me: null, jobs: [] };
let appliedMap = {};
let jobsLoaded = false;
let lastJobsText = null; // raw JSON text of the last fetch, to skip re-rendering when nothing changed
let FIRED = {};
let tab = 'open', openId = null, installEvt = null, lastDay = '', shareMsg = '', curSheet = '';
const refreshFired = async () => { FIRED = (await LD.get('fired')) || {}; };
const status = (j, now) => j.applied ? 'applied' : (now > LD.deadlineAt(j) ? 'closed' : 'open');

/* ---------- toast and sheets ---------- */
const toastEl = $('#toast');
let tt;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  try { if (!toastEl.matches(':popover-open')) toastEl.showPopover(); } catch (e) { /* older browsers: shown in normal flow */ }
  clearTimeout(tt);
  tt = setTimeout(() => {
    toastEl.classList.remove('show');
    try { toastEl.hidePopover(); } catch (e) {}
  }, 3600);
}
const dlg = $('#sheet');
function sheet(html, name = '') { curSheet = name; dlg.innerHTML = html; if (!dlg.open) dlg.showModal(); }
function closeSheet() { if (dlg.open) dlg.close(); }
dlg.addEventListener('close', () => { curSheet = ''; });
dlg.addEventListener('click', e => { if (e.target === dlg) closeSheet(); });

/* ---------- reminders (in-app only, no push notifications) ---------- */
function notify(m) {
  if (document.visibilityState === 'visible') toast(m.title);
}
async function tick() {
  if (!S.me || !jobsLoaded) return;
  let out = [];
  try { out = await LD.runDue(S.jobs, notify); await refreshFired(); } catch (e) {}
  const day = new Date().toDateString();
  if (out.length || day !== lastDay) { lastDay = day; render(); } else updateBell();
}

/* ---------- GitHub: the shared job list lives in jobs.json in your repo ---------- */
function mergeApplied(list) {
  return list.map(j => ({ ...j, applied: !!appliedMap[j.id] }));
}
// Public read: no token needed, works for every visitor straight from the repo's raw file.
async function loadJobsPublic() {
  const res = await fetch(rawUrl(), { cache: 'no-store' });
  if (res.status === 404) throw new Error('jobs.json not found in the repo yet.');
  if (!res.ok) throw new Error('GitHub read failed: ' + res.status);
  const text = await res.text();
  if (text === lastJobsText) return false; // nothing changed since last poll
  lastJobsText = text;
  S.jobs = mergeApplied(JSON.parse(text || '[]'));
  return true;
}
async function pollJobs() {
  try {
    const changed = await loadJobsPublic();
    jobsLoaded = true;
    if (changed) { render(); tick(); } else updateBell();
  } catch (e) {
    jobsLoaded = true;
    toast(e.message || 'Could not reach the shared job list.');
    render();
  }
}
// Authenticated read+write: only needed the moment someone adds/edits/deletes a job.
async function ghGetForWrite() {
  const res = await fetch(apiUrl() + '?ref=' + GITHUB.branch, { headers: authHeaders(), cache: 'no-store' });
  if (!res.ok) throw new Error('Could not read jobs.json (status ' + res.status + '). Check your GitHub setup.');
  const data = await res.json();
  return { arr: JSON.parse(fromB64(data.content.replace(/\n/g, '')) || '[]'), sha: data.sha };
}
async function ghPut(arr, sha, message) {
  const res = await fetch(apiUrl(), {
    method: 'PUT', headers: authHeaders(),
    body: JSON.stringify({ message, content: toB64(JSON.stringify(arr, null, 2)), sha, branch: GITHUB.branch })
  });
  if (res.status === 409) { const e = new Error('conflict'); e.conflict = true; throw e; }
  if (!res.ok) throw new Error('Could not save to GitHub (status ' + res.status + ').');
  return res.json();
}
async function ghWrite(mutate, message) {
  for (let attempt = 0; attempt < 2; attempt++) {
    const { arr, sha } = await ghGetForWrite();
    const result = mutate(arr);
    try { await ghPut(arr, sha, message); return result; }
    catch (e) { if (!e.conflict || attempt === 1) throw e; } // someone else wrote first — retry once against latest data
  }
}
async function initGithub() {
  if (!ghConfigured()) {
    jobsLoaded = true;
    render();
    toast('Add your GitHub repo details at the top of index.html to connect the shared job list.');
    return;
  }
  await pollJobs();
  setInterval(pollJobs, 20000); // everyone's app checks jobs.json every 20s for changes
}

/* ---------- views ---------- */
function urgency(n) { return n <= 1 ? 'var(--urgent)' : n <= 3 ? 'var(--soon)' : 'var(--calm)'; }
function countBlock(j, st, now) {
  const n = LD.daysLeft(j, now);
  if (st === 'applied') return { num: 'Applied', unit: '', c: 'var(--ok)', word: 1 };
  if (st === 'closed') return { num: 'Closed', unit: '', c: 'var(--done)', word: 1 };
  if (n <= 0) return { num: 'Today', unit: 'until ' + LD.fmtTime(j.t), c: urgency(0), word: 1 };
  return { num: String(n), unit: n === 1 ? 'day left' : 'days left', c: urgency(n) };
}
function hero(open, now) {
  if (!jobsLoaded) return ['Loading jobs…', ''];
  if (!S.jobs.length) return ['Add the first job', 'Add a deadline — everyone using this app sees it right away.'];
  const today = open.filter(j => LD.daysLeft(j, now) === 0);
  const tmrw = open.filter(j => LD.daysLeft(j, now) === 1);
  const sub = open[0] ? `Next last date: ${open[0].company}, ${LD.dateLabel(open[0])}` : '';
  if (today.length) return [`${today.length} ${today.length === 1 ? 'job closes' : 'jobs close'} today`, sub];
  if (tmrw.length) return [`${tmrw.length} ${tmrw.length === 1 ? 'job closes' : 'jobs close'} tomorrow`, sub];
  if (open.length) return [`${open.length} open ${open.length === 1 ? 'job' : 'jobs'}`, sub];
  return ['Nothing open right now', 'Add a new job when one comes in.'];
}
function detailHTML(j, st) {
  const facts = [['Eligibility', j.elig], ['Pay', j.pay], ['Location', j.loc]].filter(f => f[1]);
  const id = esc(j.id);
  return `<div class="detail">
    ${facts.length ? `<dl class="facts">${facts.map(([k, v]) => `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>` : ''}
    ${j.note ? `<p class="note">${esc(j.note)}</p>` : ''}
    ${st === 'open' ? `<p class="fine">Reminders at ${LD.fmtTime(j.rt)} the day before and on the last date.${j.by ? ` Posted by ${esc(j.by)}.` : ''}</p>` : (j.by ? `<p class="fine">Posted by ${esc(j.by)}.</p>` : '')}
    <div class="actions">
      ${j.link ? `<a class="btn primary" href="${esc(j.link)}" target="_blank" rel="noopener noreferrer">Apply now</a>` : ''}
      <button class="btn" data-act="applied" data-id="${id}">${j.applied ? 'Undo applied' : 'Mark as applied'}</button>
      <button class="btn" data-act="share" data-id="${id}">${ic('send')}Share on WhatsApp</button>
      <button class="btn" data-act="edit" data-id="${id}">Edit</button><button class="btn danger" data-act="delete" data-id="${id}">Delete</button>
    </div></div>`;
}
function jobRow(j, now) {
  const st = status(j, now), b = countBlock(j, st, now), open = openId === j.id, id = esc(j.id);
  return `<li class="job ${st}">
    <button class="row" data-act="toggle" data-id="${id}" aria-expanded="${open}">
      <span class="count" style="--c:${b.c}"><span class="num${b.word ? ' word' : ''}">${b.num}</span>${b.unit ? `<span class="unit">${esc(b.unit)}</span>` : ''}</span>
      <span class="info"><span class="co">${esc(j.company)}</span><span class="role">${esc(j.role)}</span><span class="when">Last date ${LD.dateLabel(j)}, ${LD.fmtTime(j.t)}</span></span>
      ${ic('down', 'chev')}
    </button>
    ${open ? detailHTML(j, st) : ''}
  </li>`;
}
function onboardHTML() {
  return `<main class="wrap onboard"><div class="brand big">Last Date</div>
    <p class="lead">Job deadlines, shared with everyone using this app, with reminders before they close.</p>
    <form id="nameForm">
      <label class="field"><span>Your name</span><input name="name" required maxlength="40" autocomplete="given-name"></label>
      <button class="btn primary wide">Continue</button>
    </form>
    <p class="fine">Jobs are shared with everyone. Your name and applied status stay on this device.</p></main>`;
}
function render() {
  const app = $('#app');
  if (!S.me) { app.innerHTML = onboardHTML(); return; }
  const now = new Date();
  const g = { open: [], applied: [], closed: [] };
  S.jobs.forEach(j => g[status(j, now)].push(j));
  const asc = (a, b) => LD.deadlineAt(a) - LD.deadlineAt(b);
  g.open.sort(asc); g.applied.sort(asc); g.closed.sort((a, b) => asc(b, a));
  const [h, sub] = hero(g.open, now);
  const empty = {
    open: !jobsLoaded ? '' : (S.jobs.length ? 'No open jobs right now.' : 'Tap Add a job to add the first one.'),
    applied: 'Jobs you mark as applied show up here and stop sending reminders.',
    closed: 'Jobs move here after their last date.'
  }[tab];
  const names = { open: 'Open', applied: 'Applied', closed: 'Closed' };
  $('#app').innerHTML = `<main class="wrap">
    <header class="top"><div class="brand">Last Date</div><div class="tools">
      <button class="icon" data-act="bell" aria-label="Reminders">${ic('bell')}<span class="dot" id="dot" hidden></span></button>
      <button class="icon" data-act="menu" aria-label="Settings">${ic('tune')}</button>
    </div></header>
    <h1 class="hero">${esc(h)}</h1>
    ${sub ? `<p class="sub">${esc(sub)}</p>` : ''}
    <div class="tabs" role="tablist">${['open', 'applied', 'closed'].map(t => `<button class="tab" role="tab" data-act="tab" data-tab="${t}" aria-selected="${tab === t}">${names[t]}<small>${g[t].length}</small></button>`).join('')}</div>
    ${g[tab].length ? `<ul class="list">${g[tab].map(j => jobRow(j, now)).join('')}</ul>` : `<p class="empty">${empty}</p>`}
  </main>
  <button class="fab" data-act="post">${ic('plus')}Add a job</button>`;
  updateBell();
}
function updateBell() {
  const dot = $('#dot');
  if (!dot || !S.me) return;
  dot.hidden = !Object.entries(FIRED).some(([k, v]) => !v.skip && !v.read && S.jobs.some(j => j.id === k.split('|')[0]));
}

/* ---------- sheets ---------- */
function jobForm(j) {
  const v = j || { company: '', role: '', d: '', t: '23:59', rt: '09:00', link: '', elig: '', pay: '', loc: '', note: '' };
  sheet(`<form class="sheet" id="jobForm" data-id="${j ? esc(j.id) : ''}">
    <h2>${j ? 'Edit job' : 'Add a job'}</h2>
    <label class="field"><span>Company</span><input name="company" required maxlength="80" value="${esc(v.company)}"></label>
    <label class="field"><span>Role</span><input name="role" required maxlength="120" value="${esc(v.role)}" placeholder="Backend intern"></label>
    <div class="grid2">
      <label class="field"><span>Last date</span><input type="date" name="d" required ${j ? '' : `min="${LD.todayStr()}"`} value="${esc(v.d)}"></label>
      <label class="field"><span>Closes at</span><input type="time" name="t" value="${esc(v.t)}"></label>
    </div>
    <label class="field"><span>Send reminders at</span><input type="time" name="rt" value="${esc(v.rt)}"><small>Everyone is reminded at this time the day before and on the last date.</small></label>
    <label class="field"><span>Apply link</span><input name="link" inputmode="url" autocapitalize="off" value="${esc(v.link)}" placeholder="careers.example.com/apply"></label>
    <label class="field"><span>Eligibility or batch</span><input name="elig" maxlength="200" value="${esc(v.elig)}" placeholder="2026 batch, CS or IT"></label>
    <div class="grid2">
      <label class="field"><span>Stipend or salary</span><input name="pay" maxlength="120" value="${esc(v.pay)}"></label>
      <label class="field"><span>Location or remote</span><input name="loc" maxlength="120" value="${esc(v.loc)}"></label>
    </div>
    <label class="field"><span>Anything else to show</span><textarea name="note" maxlength="1200" placeholder="Referral details, test date, documents needed">${esc(v.note)}</textarea></label>
    <div class="actions"><button class="btn primary">${j ? 'Save changes' : 'Add job'}</button><button type="button" class="btn ghost" data-act="close">Cancel</button></div>
  </form>`, 'job');
}
function buildLink(j) {
  // A deep link into the shared list — it carries no data of its own, it just opens
  // and scrolls to this job. Whoever opens it sees it because it's the same shared list.
  return location.href.split('#')[0].split('?')[0] + '#open=' + encodeURIComponent(j.id);
}
function shareText(j, link, mode) {
  const n = LD.daysLeft(j, new Date());
  const head = mode === 'new' ? 'New job' : mode === 'update' ? 'Updated job' : n <= 0 ? 'Last day today' : n === 1 ? 'Closes tomorrow' : 'Job alert';
  const lines = [`*${head}: ${j.company}, ${j.role}*`, `Last date: ${LD.dateLabel(j)}, ${LD.fmtTime(j.t)}`];
  if (j.loc) lines.push(`Location: ${j.loc}`);
  if (j.pay) lines.push(`Pay: ${j.pay}`);
  if (j.elig) lines.push(`Eligibility: ${j.elig}`);
  if (j.link) lines.push(`Apply: ${j.link}`);
  lines.push('', 'Open it in Last Date:', link);
  return lines.join('\n');
}
function openShare(j, mode) {
  const link = buildLink(j);
  shareMsg = shareText(j, link, mode);
  const head = { new: 'Job added. Let people know.', update: 'Saved. Let people know it changed.', nudge: 'Send a reminder' }[mode];
  sheet(`<div class="sheet"><h2>${head}</h2><p class="fine">Everyone using the app already sees this job — sharing is just a heads-up.</p>
    <pre class="preview">${esc(shareMsg)}</pre>
    <div class="actions stack">
      <a class="btn primary" href="https://wa.me/?text=${encodeURIComponent(shareMsg)}" target="_blank" rel="noopener noreferrer">${ic('send')}Send on WhatsApp</a>
      <button class="btn" data-act="copy">Copy message</button>
      ${navigator.share ? '<button class="btn" data-act="nativeShare">More apps</button>' : ''}
      <button class="btn ghost" data-act="close">Done</button>
    </div></div>`, 'share');
}
async function copyMsg() {
  try { await navigator.clipboard.writeText(shareMsg); toast('Message copied.'); return; } catch (e) {}
  const ta = document.createElement('textarea');
  ta.value = shareMsg; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); toast('Message copied.'); } catch (e) { toast('Could not copy. Select the text and copy it.'); }
  ta.remove();
}
function inboxSheet() {
  const items = Object.entries(FIRED)
    .filter(([k, v]) => !v.skip && S.jobs.some(j => j.id === k.split('|')[0]))
    .map(([k, v]) => ({ ...v, id: k.split('|')[0] }))
    .sort((a, b) => b.t - a.t);
  sheet(`<div class="sheet"><h2>Reminders</h2>
    ${items.length
      ? `<ul class="inbox">${items.map(i => `<li><button data-act="openjob" data-id="${esc(i.id)}"><span class="t">${esc(i.title)}</span><span class="b">${esc(i.body)}</span><span class="ago">${ago(i.t)}</span></button></li>`).join('')}</ul>`
      : '<p class="empty">Reminders show up here when a last date is close.</p>'}
    <div class="actions"><button class="btn ghost" data-act="close">Close</button></div></div>`, 'inbox');
  LD.update('fired', cur => { cur = cur || {}; for (const k in cur) cur[k].read = 1; return cur; }).then(refreshFired).then(updateBell);
}
function settingsSheet() {
  sheet(`<div class="sheet"><h2>Settings</h2>
    <label class="field"><span>Your name</span><input data-set="name" value="${esc(S.me.name)}" maxlength="40" autocomplete="given-name"></label>
    ${installEvt ? '<div class="rowline"><div>Install app<br><small>Add Last Date to your home screen.</small></div><button class="btn sm" data-act="install">Install</button></div>' : ''}
    <p class="fine">The job list is shared with everyone using this app. Reminders show up whenever you open the app, and in the bell icon for anything you missed.</p>
    <div class="actions"><button class="btn danger sm" data-act="reset">Clear this device</button><button class="btn ghost" data-act="close">Close</button></div></div>`, 'settings');
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id, job = id && S.jobs.find(j => j.id === id);
  if (act === 'tab') { tab = el.dataset.tab; render(); }
  else if (act === 'toggle') { openId = openId === id ? null : id; render(); }
  else if (act === 'applied' && job) {
    if (appliedMap[id]) delete appliedMap[id]; else appliedMap[id] = true;
    await LD.set('applied', appliedMap);
    job.applied = !!appliedMap[id]; openId = null;
    render();
    toast(job.applied ? 'Marked as applied. Its reminders are off for you.' : 'Back in Open. Reminders are on again.');
    tick();
  }
  else if (act === 'share' && job) openShare(job, 'nudge');
  else if (act === 'edit' && job) jobForm(job);
  else if (act === 'delete' && job) {
    if (!ghConfigured()) { toast('Not connected to the shared job list yet.'); return; }
    if (confirm(`Delete ${job.company}? This removes it for everyone.`)) {
      openId = null;
      try {
        await ghWrite(arr => { const i = arr.findIndex(x => x.id === id); if (i > -1) arr.splice(i, 1); }, `Delete job: ${job.company}`);
        await LD.clearFired(id); delete appliedMap[id]; await LD.set('applied', appliedMap);
        await refreshFired(); await pollJobs(); toast('Deleted.');
      } catch (e) { toast('Could not delete. Check your connection and GitHub setup.'); }
    }
  }
  else if (act === 'post') jobForm();
  else if (act === 'bell') inboxSheet();
  else if (act === 'menu') settingsSheet();
  else if (act === 'close') closeSheet();
  else if (act === 'copy') copyMsg();
  else if (act === 'nativeShare') { try { await navigator.share({ text: shareMsg }); } catch (err) {} }
  else if (act === 'openjob') {
    closeSheet(); openId = id;
    if (job) tab = status(job, new Date());
    render();
    const row = document.querySelector(`[data-act="toggle"][data-id="${id}"]`);
    if (row) row.scrollIntoView({ block: 'center' });
  }
  else if (act === 'install' && installEvt) { installEvt.prompt(); installEvt = null; closeSheet(); }
  else if (act === 'reset') {
    if (confirm('Remove your name, applied status and seen reminders from this device? (Jobs themselves are shared and stay for everyone else.)')) {
      await LD.clear(); location.href = location.href.split('#')[0];
    }
  }
});

document.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, fd = new FormData(f), v = k => String(fd.get(k) || '').trim();
  if (f.id === 'nameForm') {
    const name = v('name').slice(0, 40);
    if (!name) return;
    S.me = { name };
    await LD.set('me', S.me);
    render(); tick();
  }
  else if (f.id === 'jobForm') {
    if (!ghConfigured()) { toast('Not connected to the shared job list yet.'); return; }
    let link = v('link');
    if (link && !/^[a-z][a-z0-9+.-]*:/i.test(link)) link = 'https://' + link;
    const clean = link ? safeUrl(link) : '';
    if (link && !clean) { toast('That apply link does not look right.'); return; }
    const data = { company: v('company'), role: v('role'), d: v('d'), t: v('t') || '23:59', rt: v('rt') || '09:00', link: clean, elig: v('elig'), pay: v('pay'), loc: v('loc'), note: v('note') };
    if (!data.company || !data.role || !data.d) { toast('Add a company, a role and a last date.'); return; }
    const id = f.dataset.id;
    try {
      if (id) {
        const old = S.jobs.find(x => x.id === id);
        if (!old) return;
        const resched = old.d !== data.d || old.t !== data.t || old.rt !== data.rt;
        await ghWrite(arr => {
          const i = arr.findIndex(x => x.id === id);
          if (i > -1) arr[i] = { ...arr[i], ...data, v: Date.now() };
        }, `Update job: ${data.company} - ${data.role}`);
        if (resched) await LD.clearFired(id, ['d1', 'd0']);
        await refreshFired(); await pollJobs(); closeSheet();
        toast('Saved.');
        openShare({ id, ...old, ...data }, 'update');
      } else {
        const job = { id: newId(), ...data, by: S.me.name, postedAt: Date.now(), v: Date.now() };
        await ghWrite(arr => { arr.push(job); }, `Add job: ${data.company} - ${data.role}`);
        await pollJobs();
        tab = 'open'; closeSheet();
        toast('Job added: ' + data.company + ' - ' + data.role);
        openShare(job, 'new');
      }
    } catch (err) { toast('Could not save. Check your connection and GitHub setup.'); }
  }
});

document.addEventListener('change', async e => {
  const t = e.target;
  if (!t.dataset || !t.dataset.set || !S.me) return;
  if (t.dataset.set === 'name') {
    const n = t.value.trim().slice(0, 40);
    if (n) { S.me.name = n; await LD.set('me', S.me); toast('Name saved.'); }
  }
});

window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') tick(); });

/* ---------- start ---------- */
async function boot() {
  try {
    S.me = (await LD.get('me')) || null;
    appliedMap = (await LD.get('applied')) || {};
    await refreshFired();
  } catch (e) {
    toast('Storage is blocked in this browser, so your name and applied status will not be saved.');
  }
  const h = location.hash;
  if (h.startsWith('#open=')) {
    openId = decodeURIComponent(h.slice(6));
    history.replaceState(null, '', location.href.split('#')[0]);
  }
  render();
  await initGithub();
  setInterval(tick, 30000); // time-based reminder check, independent of polling for new/changed jobs
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
boot();
})();
</script>
</body>
</html>
